<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VRM 规范效果对比与演示</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #header {
        padding: 12px 20px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
      }
      .badge {
        background: #3b82f6;
        color: white;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 9999px;
        margin-left: 8px;
        font-weight: 600;
      }
      #container {
        flex: 1;
        position: relative;
        width: 100%;
        height: 100%;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
      }
      #panel {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(30, 41, 59, 0.9);
        backdrop-filter: blur(16px);
        padding: 14px 20px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: flex;
        gap: 12px;
        align-items: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        z-index: 10;
        max-width: 95vw;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        background: #334155;
        color: #f8fafc;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: all 0.2s ease;
      }
      button:hover { background: #475569; }
      button.active {
        background: #2563eb;
        border-color: #60a5fa;
        color: white;
      }
      button.special {
        background: #0284c7;
        border-color: #38bdf8;
      }
      .status-text {
        font-size: 13px;
        color: #94a3b8;
      }
      #info-box {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 13px;
        line-height: 1.6;
        color: #cbd5e1;
        max-width: 340px;
        z-index: 10;
      }
      #info-box h3 {
        color: #60a5fa;
        font-size: 14px;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <div style="display: flex; align-items: center;">
        <h2 style="font-size: 16px;">VRM 规范效果对比与演示</h2>
        <span class="badge">@pixiv/three-vrm</span>
      </div>
      <div>
        <a href="/" style="color: #94a3b8; font-size: 13px; text-decoration: none;">返回主页 →</a>
      </div>
    </div>

    <div id="container">
      <div id="canvas-container"></div>

      <div id="info-box">
        <h3 id="info-title">当前模型：鲸鱼娘 (AI转版)</h3>
        <p id="info-desc">• 来源：Tripo AI 生成网格 + 算法缝合眼皮</p>
        <p>• 姿态：已纠正手臂自然垂下（避免 T-Pose）</p>
        <p>• 动捕：AIRI 官方待机呼吸循环</p>
        <div id="info-note" style="margin-top: 8px; font-size: 12px; color: #f59e0b; background: rgba(245, 158, 11, 0.1); padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(245, 158, 11, 0.2);">
          💡 点击下方“切换为专业版 VRM”，可直接对比工业级建模师制作的真实眼睑与自然动作。
        </div>
      </div>

      <div id="panel">
        <span class="status-text" id="status">正在加载...</span>
        <button id="btn-switch-model" class="special">切换为专业版 VRM (DeepSeek-chan)</button>
        <button id="btn-pose" class="active">自然垂手姿势</button>
        <button id="btn-idle" class="active">AIRI 待机呼吸</button>
        <button id="btn-blink">触发眨眼</button>
        <button id="btn-talk">张嘴说话 (aa/ou)</button>
        <button id="btn-look" class="active">视线跟随</button>
      </div>
    </div>

    <script type="module" src="/src/vrm-main.js"></script>
  </body>
</html>
