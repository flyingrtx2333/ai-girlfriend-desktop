rules:
  - id: python-request-sql
    languages: [python]
    severity: ERROR
    message: External request data reaches a SQL query
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args.get(...)
          - pattern: flask.request.form.get(...)
          - pattern: flask.request.values.get(...)
          - pattern: flask.request.json.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.execute($QUERY, ...)
              - pattern: $DB.executemany($QUERY, ...)
          - focus-metavariable: $QUERY
  - id: python-request-shell
    languages: [python]
    severity: ERROR
    message: External request data reaches a shell command
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args.get(...)
          - pattern: flask.request.form.get(...)
          - pattern: flask.request.values.get(...)
          - pattern: flask.request.json.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern: shlex.quote(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
              - pattern: subprocess.run($CMD, ..., shell=True, ...)
              - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
              - pattern: subprocess.call($CMD, ..., shell=True, ...)
              - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - focus-metavariable: $CMD
  - id: python-request-eval
    languages: [python]
    severity: ERROR
    message: External request data is evaluated as code
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args.get(...)
          - pattern: flask.request.form.get(...)
          - pattern: flask.request.values.get(...)
          - pattern: flask.request.json.get(...)
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($CODE, ...)
              - pattern: exec($CODE, ...)
          - focus-metavariable: $CODE
  - id: js-request-shell
    languages: [javascript, typescript]
    severity: ERROR
    message: External request data reaches a shell command
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: req.query
          - pattern: req.body
          - pattern: req.params
          - pattern: request.query
          - pattern: request.body
          - pattern: request.params
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: child_process.exec($CMD, ...)
              - pattern: child_process.execSync($CMD, ...)
              - patterns:
                  - pattern-inside: |
                      import { exec } from "node:child_process";
                      ...
                  - pattern: exec($CMD, ...)
              - patterns:
                  - pattern-inside: |
                      import { execSync } from "node:child_process";
                      ...
                  - pattern: execSync($CMD, ...)
              - patterns:
                  - pattern-inside: |
                      import { exec as $EXEC } from "node:child_process";
                      ...
                  - pattern: $EXEC($CMD, ...)
              - patterns:
                  - pattern-inside: |
                      import { execSync as $EXEC } from "node:child_process";
                      ...
                  - pattern: $EXEC($CMD, ...)
          - focus-metavariable: $CMD
  - id: js-request-sql
    languages: [javascript, typescript]
    severity: ERROR
    message: External request data reaches a SQL query
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: req.query
          - pattern: req.body
          - pattern: req.params
          - pattern: request.query
          - pattern: request.body
          - pattern: request.params
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($QUERY, ...)
              - pattern: $DB.execute($QUERY, ...)
          - focus-metavariable: $QUERY
  - id: js-request-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: External request data is evaluated as code
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: req.query
          - pattern: req.body
          - pattern: req.params
          - pattern: request.query
          - pattern: request.body
          - pattern: request.params
    pattern-sinks:
      - patterns:
          - pattern: eval($CODE)
          - focus-metavariable: $CODE
