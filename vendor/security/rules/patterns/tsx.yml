id: tsx-tls-verification
language: Tsx
severity: error
message: TLS certificate verification is disabled
rule:
  kind: pair
  all:
    - has:
        field: key
        regex: ^(rejectUnauthorized|'rejectUnauthorized'|"rejectUnauthorized")$
    - has:
        field: value
        kind: 'false'
---
id: tsx-eval
language: Tsx
severity: warning
message: Direct eval executes text as code
rule:
  pattern: eval($$$ARGS)
